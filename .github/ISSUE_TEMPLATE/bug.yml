name: Bug
description: Something in Unseen doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      placeholder: Popup, the note above an email, settings ...
  - type: input
    id: browser
    attributes:
      label: Browser and version
